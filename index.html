<!DOCTYPE html>

    </button>

      class="nav rounded-2xl py-2 text-[11px] font-bold">
      Salud
    </button>

    <button onclick="setView('fe')" id="nav-fe"
      class="nav rounded-2xl py-2 text-[11px] font-bold">
      Fe
    </button>

  </div>

<script>

const TZ='America/Mexico_City';

const today=()=>new Date().toLocaleDateString(
  'en-CA',
  {timeZone:TZ}
);

const esc=s=>String(s??'').replace(
  /[&<>"']/g,
  m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m])
);

const num=x=>Number(x||0);

const clamp=x=>Math.max(0,Math.min(100,x));

const DAYS=[
  'Domingo',
  'Lunes',
  'Martes',
  'Miércoles',
  'Jueves',
  'Viernes',
  'Sábado'
];


/* =========================
   RUTINA NATE Q4
========================= */

    ['Extensión tríceps en polea','Tríceps',2,'10–15','1:00',1],
    ['Extensión tríceps overhead cuerda','Tríceps',2,'10–15','1:00',1]
  ]
},

{
  day:'Martes',
  name:'PULL',
  focus:'Espalda + deltoide posterior + bíceps',
  ex:[
    ['Jalón al pecho agarre neutro/medio','Espalda',3,'6–10','2:00',2],
    ['Remo con pecho apoyado','Espalda',3,'8–12','2:00',2],
    ['Jalón unilateral hacia cadera','Espalda',2,'10–15','1:15',1],
    ['Reverse pec-deck / pájaros','Hombro posterior',3,'12–20','1:00',1],
    ['Curl inclinado mancuernas','Bíceps',2,'8–12','1:00',1],
    ['Curl martillo','Bíceps',2,'10–15','1:00',1]
  ]
},

{

  name:'LEGS A',

  ex:[
    ['Hack squat / sentadilla Smith','Pierna',3,'6–10','2:30',2],
    ['Peso muerto rumano','Femoral',3,'6–10','2:00',2],
    ['Prensa','Cuádriceps',2,'10–15','1:30',2],
    ['Curl femoral','Femoral',3,'10–15','1:15',1],
    ['Extensión de cuádriceps','Cuádriceps',2,'12–15','1:00',1],
    ['Pantorrilla','Pantorrilla',2,'10–15','1:00',1],

},

{
  day:'Jueves',
  name:'UPPER',
  focus:'Torso + especialización',
  ex:[
    ['Press inclinado Smith','Pecho',3,'8–12','2:00',2],
    ['Remo sentado polea / máquina','Espalda',3,'8–12','1:30',2],
    ['Jalón al pecho','Espalda',2,'10–15','1:30',2],
    ['Elevaciones laterales','Hombro',3,'12–20','1:00',1],
    ['Curl predicador / máquina','Bíceps',2,'10–15','1:00',1],
    ['Extensión tríceps polea','Tríceps',2,'10–15','1:00',1]

},

{
  day:'Viernes',
  name:'LEGS B + DELTS/ARMS',
  focus:'Cadena posterior + estética + core',
  ex:[
    ['Hip thrust','Glúteo',3,'6–10','2:00',2],
    ['Bulgarian split squat','Pierna',2,'8–12','1:30',2],
    ['Curl femoral','Femoral',3,'10–15','1:15',1],
    ['Elevación lateral máquina/mancuerna','Hombro',3,'12–20','1:00',1],
    ['Curl en polea','Bíceps',2,'10–15','1:00',1],
    ['Extensión tríceps overhead','Tríceps',2,'10–15','1:00',1],
    ['Crunch en polea','Core',3,'10–15','1:00',1]
  ]
}

];


/* =========================
   DATOS
========================= */

function fresh(){
  return {
    version:2,

    gymAttendance:{},

    routineV2,

    workouts:{},

    progress:[],

    macroGoal:{
      calories:2400,
      protein:155,
      carbs:275,
      fats:70
    },

    macroLog:{},

    meals:{},

    body:{},

    sleep:{},

    cardio:{},

    faith:{},

    finance:[],

    budgets:{},

    settings:{
      returnPhaseStart:today()
    }
  };
}


/* =========================
   MIGRACIÓN V1 → V2
========================= */

function migrate(){

  let old={};

  try{
    old=JSON.parse(
      localStorage.getItem('nlt-pro')
    )||{};
  }
  catch(e){}

  if(old.version===2){
    return old;
  }

  let n=fresh();

  [
    'gymAttendance',
    'progress',
    'macroLog',
    'finance',
    'budgets',
    'faith'
  ].forEach(k=>{
    if(old[k]){
      n[k]=old[k];
    }
  });

  if(old.macroGoal){
    n.oldMacroGoal=old.macroGoal;
  }

  return n;
}


let data=migrate();

localStorage.setItem(
  'nlt-pro',
  JSON.stringify(data)
);

let view=
  localStorage.getItem('nlt-view-v2')
  ||
  'inicio';


/* =========================
   SISTEMA
========================= */

function save(renderAgain=true){

  localStorage.setItem(
    'nlt-pro',
    JSON.stringify(data)
  );

  if(renderAgain){
    render();
  }
}


function setView(v){

  view=v;

  localStorage.setItem(
    'nlt-view-v2',
    v
  );

  render();
}


function app(html){

  document.getElementById('app').innerHTML=html;

}


/* =========================
   UI
========================= */

function section(title,sub=''){

  return `
    <div class="mb-4">

      <h1 class="text-3xl font-black tracking-tight">
        ${title}
      </h1>

      ${
        sub
        ?
        `<p class="text-slate-500 text-sm mt-1">
          ${sub}
        </p>`
        :
        ''
      }

    </div>
  `;
}


function card(title,value,sub){

  return `
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200">

      <p class="text-xs font-bold text-slate-500">
        ${title}
      </p>

      <p class="text-2xl font-black mt-1">
        ${value}
      </p>

      <p class="text-xs text-slate-500 mt-1">
        ${sub}
      </p>

    </div>
  `;
}


function input(label,name,value='',type='text',placeholder=''){

  return `
    <label>

      <span class="text-xs font-bold text-slate-500">
        ${label}
      </span>

      <input
        id="${name}"
        type="${type}"
        value="${esc(value)}"
        placeholder="${placeholder}"
        class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 bg-white outline-none focus:ring-2 focus:ring-slate-900"
      >

    </label>
  `;
}


function pill(text,active,click){

  return `
    <button
      onclick="${click}"
      class="px-4 py-2 rounded-full whitespace-nowrap text-sm font-black ${
        active
        ?
        'bg-slate-950 text-white'
        :
        'bg-white text-slate-500 border border-slate-200'
      }"
    >
      ${text}
    </button>
  `;
}


function val(x){

  return document.getElementById(x)?.value||'';

}


function dayName(date=today()){

  const [y,m,d]=date
    .split('-')
    .map(Number);

  return DAYS[
    new Date(y,m-1,d).getDay()
  ];

}


function planFor(date=today()){

  return routineV2.find(
    r=>r.day===dayName(date)
  )||null;

}


function pct(a,b){

  return b
    ?
    clamp(Math.round(a/b*100))
    :
    0;

}


function bar(a,b){

  return `
    <div class="bar mt-2">
      <span style="width:${pct(a,b)}%"></span>
    </div>
  `;

}


function habit(label,done){

  return `
    <div class="flex justify-between bg-slate-50 rounded-2xl px-4 py-3">

      <span class="font-semibold">
        ${label}
      </span>

      <span>
        ${done?'✓':'○'}
      </span>

    </div>
  `;

}


/* =========================
   INICIO
========================= */

  const t=today();

  const plan=planFor(t);

  const ml=data.macroLog[t]||{};

  const body=data.body[t]||{};

  const sl=data.sleep[t]||{};

  const f=data.faith[t]||{};

  const completed=
    data.workouts[t]?.completed;


  app(`

    ${section(
      'Nate Life Tracker',
      'The Nate System · dirección, no perfección.'
    )}


    <div class="bg-slate-950 text-white rounded-[2rem] p-5 shadow-lg mb-4">

      <p class="text-sm text-slate-300">
        Hoy · ${dayName()} · ${t}
      </p>

      <h2 class="text-2xl font-black mt-1">
        ${
          plan
          ?
          plan.name
          :
          (
            dayName()==='Domingo'
            ?
            'Fútbol + recuperación'
            :
            'Recuperación / vida'

        }
      </h2>

      <p class="text-sm text-slate-300 mt-1">
        ${
          plan
          ?
          plan.focus
          :
          'El sistema sirve a tu vida.'
        }
      </p>

      ${
        plan
        ?
        `
        <button
          onclick="setView('gym')"
          class="mt-4 bg-white text-slate-950 rounded-2xl px-4 py-3 font-black w-full"
        >
          Abrir entrenamiento
        </button>

        :
        ''
      }

    </div>


    <div class="grid grid-cols-2 gap-3 mb-4">

      ${card(
        'Entrenamiento',
        completed?'Hecho':'Pendiente',

      )}

        'Peso',

      <h2 class="font-black text-xl">
        Hoy
      </h2>

      <div class="mt-3 space-y-2">

          'Entrenamiento',

        )}

          'Nutrición registrada',

        )}

        ${habit(
          'Oración',
          !!f.prayed

        ${habit(
          'Examen / oración nocturna',
          !!f.exam
        )}

    <div class="bg-white rounded-3xl p-5 border border-slate-200">

      <p class="text-xs font-black text-slate-500">
        REGLA DEL SISTEMA
      </p>

        Ritmos, no perfección.
      </p>

      <p class="text-sm text-slate-500 mt-1">

/* =========================
   GYM
========================= */

function gym(tab='hoy'){

  app(`

    ${section(
      'Gym',
      '5 días L–V · 50 min · sábado recuperación opcional.'
    )}

    <div class="flex gap-2 mb-5 overflow-x-auto">

      ${pill(
        'Hoy',
        tab==='hoy',
        "gym('hoy')"
      )}

      ${pill(
        'Rutina',
        tab==='rutina',
        "gym('rutina')"
      )}

      ${pill(
        'Historial',
        tab==='historial',
        "gym('historial')"
      )}

      ${pill(
        'Cardio',
        tab==='cardio',
        "gym('cardio')"
      )}

    </div>

    <div id="gym-content"></div>

  `);


  if(tab==='hoy'){
    gymToday();
  }

  if(tab==='rutina'){
    gymRoutine();
  }

  if(tab==='historial'){
    gymHistory();
  }

  if(tab==='cardio'){
    cardio();
  }

}


function phaseSets(exSets){

  const start=
    new Date(
      data.settings.returnPhaseStart+
      'T12:00:00'
    );

  const now=
    new Date(
      today()+
      'T12:00:00'
    );

  const days=
    Math.floor(
      (now-start)/86400000
    );

  return days<14
    ?
    Math.min(2,exSets)
    :
    exSets;

}


function gymToday(){

  const t=today();

  const plan=planFor(t);

  const w=
    data.workouts[t]
    ||
    {
      sets:{},
      completed:false
    };

  const el=
    document.getElementById(
      'gym-content'
    );


  if(!plan){

    el.innerHTML=`

      <div class="bg-white rounded-3xl p-5 border">

        <h2 class="font-black text-xl">
          Sin pesas programadas
        </h2>

        <p class="text-slate-500 mt-1">

          ${
            dayName()==='Domingo'
            ?
            'Fútbol + recuperación.'
            :
            'Sábado es recuperación de una sesión perdida si aplica.'
          }

        </p>

      </div>
    `;

    return;

  }


  el.innerHTML=`

    <div class="bg-white rounded-3xl p-5 border border-slate-200 mb-4">

      <div class="flex justify-between">

        <div>

          <p class="text-xs font-black text-slate-500">
            ${plan.day}
          </p>

          <h2 class="font-black text-2xl">
            ${plan.name}
          </h2>

          <p class="text-sm text-slate-500">
            ${plan.focus}
          </p>

        </div>

        <span class="text-xs font-black bg-slate-100 rounded-full h-fit px-3 py-2">
          RIR 1–2*
        </span>

      </div>

      <p class="text-xs text-slate-500 mt-3">
        *Primeras 2 semanas:
        2 series por ejercicio y RIR ~3.
      </p>

    </div>


    <div class="space-y-3">

      ${
        plan.ex
          .map(
            (e,i)=>exerciseCard(e,i,w)
          )
          .join('')
      }

    </div>


    <button
      onclick="finishWorkout()"
      class="mt-4 w-full ${
        w.completed
        ?
        'bg-green-600'
        :
        'bg-slate-950'
      } text-white rounded-2xl py-4 font-black"
    >

      ${
        w.completed
        ?
        'Entrenamiento completado ✓'
        :
        'Finalizar entrenamiento'
      }

    </button>

  `;

}


function lastExercise(exercise){

  const rows=[];

  Object.entries(
    data.workouts
  ).forEach(
    ([date,w])=>{

      const x=
        w.entries?.find(
          a=>a.exercise===exercise
        );

      if(x){
        rows.push({
          date,
          ...x
        });
      }

    }
  );

  return rows
    .sort(
      (a,b)=>
        b.date.localeCompare(a.date)
    )[0];

}


function exerciseCard(e,i,w){

  const [
    name,
    muscle,
    sets,
    reps,
    rest,
    rir
  ]=e;

  const n=
    phaseSets(sets);

  const entry=
    w.entries?.find(
      x=>x.exercise===name
    );

  const last=
    lastExercise(name);


  return `

    <div class="bg-white rounded-3xl p-4 border border-slate-200">

      <div class="flex justify-between gap-3">

        <div>

          <h3 class="font-black">
            ${name}
          </h3>

          <p class="text-xs text-slate-500">
            ${muscle}
            · ${n}×${reps}
            · descanso ${rest}
            · RIR ${
              phaseSets(sets)<sets
              ?
              3
              :
              rir
            }
          </p>

        </div>


        ${
          last
          ?
          `
          <div class="text-right text-[11px] text-slate-500">
            Último
            <br>
            <b>
              ${esc(last.weight||'—')} kg
            </b>
          </div>
          `
          :
          ''
        }

      </div>


      <div class="grid grid-cols-3 gap-2 mt-3">

        ${input(
          'Peso kg',
          `w-${i}`,
          entry?.weight||'',
          'number'
        )}

        ${input(
          'Reps',
          `r-${i}`,
          entry?.reps||'',
          'text',
          '10,9,8'
        )}

        ${input(
          'RIR',
          `i-${i}`,
          entry?.rir??
          (
            phaseSets(sets)<sets
            ?
            3
            :
            rir
          ),
          'number'
        )}

      </div>


      <button
        onclick="saveExercise(${i})"
        class="mt-3 w-full bg-slate-100 rounded-xl py-2 text-sm font-black"
      >
        Guardar ejercicio
      </button>

    </div>

  `;

}


function saveExercise(i){

  const t=today();

  const plan=
    planFor(t);

  const e=
    plan.ex[i];


  data.workouts[t]=
    data.workouts[t]
    ||
    {
      entries:[],
      completed:false
    };


  data.workouts[t].entries=
    data.workouts[t].entries
    ||
    [];


  const x={

    exercise:e[0],

    weight:
      val(`w-${i}`),

    reps:
      val(`r-${i}`),

    rir:
      val(`i-${i}`),

    target:
      `${phaseSets(e[2])}×${e[3]}`,

    rest:e[4]

  };


  data.workouts[t].entries=
    data.workouts[t].entries.filter(
      z=>z.exercise!==e[0]
    );


  data.workouts[t].entries.push(x);


  save(false);

  gym('hoy');

}


function finishWorkout(){

  const t=today();


  data.workouts[t]=
    data.workouts[t]
    ||
    {
      entries:[]
    };


  data.workouts[t].completed=
    !data.workouts[t].completed;


  data.gymAttendance[t]=
    data.workouts[t].completed;


  save(false);

  gym('hoy');

}


function gymRoutine(){

  document.getElementById(
    'gym-content'
  ).innerHTML=

  routineV2
    .map(
      r=>`

        <div class="bg-white rounded-3xl p-5 border mb-4">

          <p class="text-xs font-black text-slate-500">
            ${r.day}
          </p>

          <h2 class="font-black text-xl">
            ${r.name}
          </h2>

          <p class="text-sm text-slate-500 mb-3">
            ${r.focus}
          </p>

          ${
            r.ex
              .map(
                e=>`

                  <div class="py-2 border-t border-slate-100">

                    <p class="font-bold text-sm">
                      ${e[0]}
                    </p>

                    <p class="text-xs text-slate-500">
                      ${e[2]}×${e[3]}
                      · ${e[4]}
                      · RIR ${e[5]}
                    </p>

                  </div>

                `
              )
              .join('')
          }

        </div>

      `
    )
    .join('');

}


function gymHistory(){

  const rows=
    Object.entries(
      data.workouts
    )
    .sort(
      (a,b)=>
        b[0].localeCompare(a[0])
    );


  document.getElementById(
    'gym-content'
  ).innerHTML=

  rows.length
  ?
  rows
    .map(
      ([d,w])=>`

        <div class="bg-white rounded-3xl p-4 border mb-3">

          <div class="flex justify-between">

            <b>
              ${d}
              · ${planFor(d)?.name||'Sesión'}
            </b>

            <span>
              ${w.completed?'✓':''}
            </span>

          </div>


          ${
            (w.entries||[])

function trend(){

  const entries=
    Object.entries(
      data.body
    )
    .filter(
      ([,b])=>b.weight
    )
    .sort(
      (a,b)=>
        a[0].localeCompare(b[0])
    );


  const last7=
    entries.slice(-7);


  const avg=
    last7.length
    ?
    (
      last7.reduce(
        (s,[,b])=>
          s+num(b.weight),
        0
      )
      /
      last7.length
    ).toFixed(1)
    :
    '—';


  const waist=
    [...entries]
      .reverse()
      .find(
        ([,b])=>b.waist
      )
      ?.[1]
      ?.waist
    ||
    '—';


  document.getElementById(
    'health'
  ).innerHTML=`

    <div class="grid grid-cols-2 gap-3 mb-4">

      ${card(
        'Peso prom.',
        avg+
        (
          avg==='—'
          ?
          ''
          :
          ' kg'
        ),
        `${last7.length} registros recientes`
      )}

      ${card(
        'Cintura',
        waist+
        (
          waist==='—'
          ?
          ''
          :
          ' cm'
        ),
        'último registro'
      )}

    </div>


    <div class="bg-white rounded-3xl p-5 border">

      <h2 class="font-black text-xl mb-3">
        Historial
      </h2>


      ${
        entries
          .slice(-12)
          .reverse()
          .map(
            ([d,b])=>`

              <div class="py-2 border-t text-sm flex justify-between">

                <span>
                  ${d}
                </span>

                <b>
                  ${b.weight} kg
                  ${
                    b.waist
                    ?
                    '· '+b.waist+' cm'
                    :
                    ''
                  }
                </b>

              </div>

            `
          )
          .join('')
        ||
        `
          <p class="text-slate-500">
            Sin datos todavía.
          </p>
        `
      }

    </div>

  `;

}

function faithBtn(k,l,d){

        'bg-green-50 text-green-700'

        'bg-slate-50'

        ${l}
      </b>

      <span>

      </span>

function toggleFaith(k){

  const t=today();

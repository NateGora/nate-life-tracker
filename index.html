function migrate(x){

let d=fresh();

if(!x)return d;

d={...d,...x};

d.routineState={
...fresh().routineState,
...(x.routineState||{})
};

d.macroGoal={
...fresh().macroGoal,
...(x.macroGoal||{})
};

d.reading={
...fresh().reading,
...(x.reading||{})
};

d.sync={
...fresh().sync,
...(x.sync||{})
};

d.settings={
...fresh().settings,
...(x.settings||{})
};

if(
d.macroGoal.kcal===2400 &&
d.macroGoal.p===155 &&
d.macroGoal.c===275 &&
d.macroGoal.f===70
){
d.macroGoal.c=287;
}

d.version='2.2-cloud';

return d;
}

function latestBody(){
let entries=Object.entries(data.body||{})

function macroToday(){

let log=data.mealLog[today()]||{};
let total={k:0,p:0,c:0,f:0};

baseMeals.forEach(m=>{
let x=log[m.id];
if(x?.done){
let z=mealMacros(x.items||m.items);
total.k+=z.k;
total.p+=z.p;
total.c+=z.c;
total.f+=z.f;
}
});

(data.extras[today()]||[]).forEach(x=>{
total.k+=n(x.k);
total.p+=n(x.p);
total.c+=n(x.c);
total.f+=n(x.f);
});

return total;
}

function completeWorkout(){

let r=currentRoutine();
let entries=[];

r.ex.forEach((e,i)=>{
let [name,sets]=e;

for(let s=0;s<sets;s++){
let weight=n(val(`w-${i}-${s}`));
let reps=n(val(`r-${i}-${s}`));
let rir=n(val(`rir-${i}-${s}`));

if(weight||reps){
entries.push({
id:crypto.randomUUID?.()||Date.now()+Math.random(),
date:today(),
routine:r.name,
exercise:name,
set:s+1,
weight,
reps,
rir
});
}
}
});

data.progress.push(...entries);

data.workouts.push({
id:crypto.randomUUID?.()||Date.now().toString(),
date:today(),
routine:r.name,
status:'completed'
});

data.gymAttendance[today()]='completed';

data.routineState.index=
(n(data.routineState.index)+1)%gymRoutine.length;

save();

alert(
`Sesión ${r.name} completada. Siguiente: ${currentRoutine().name}`
);
}

routine:currentRoutine().name,

);

function mealMacros(items){

let z={k:0,p:0,c:0,f:0};

(items||[]).forEach(([id,g])=>{
let x=foods[id];
if(!x)return;

z.k+=x.k*n(g);
z.p+=x.p*n(g);
z.c+=x.c*n(g);
z.f+=x.f*n(g);
});

return z;
}

function saveReading(id){

let b=data.reading.books.find(x=>x.id===id);

if(!b)return;

let old=n(b.currentPage);
let page=n(val('read-page'));

if(page<old)return alert('La página no puede ser menor a la actual.');

let pages=page-old;

data.reading.sessions.push({
id:crypto.randomUUID?.()||Date.now().toString(),
bookId:id,
date:today(),
startPage:old,
endPage:page,
pages,
minutes:n(val('read-min')),
note:val('read-note')
});

b.currentPage=page;

if(b.totalPages && page>=b.totalPages){
b.currentPage=b.totalPages;
b.status='terminado';
b.finishedDate=today();
}

save(false);
reading();
}

async function addFinance(){

let amount=n(val('fin-amount'));
let concept=val('fin-concept').trim();

if(!concept){
return alert('Escribe el concepto.');
}

if(!amount || amount<=0){
return alert('Escribe un monto válido.');
}

let paymentMethod=val('fin-payment');

let movement={

id:crypto.randomUUID
?crypto.randomUUID()
:Date.now().toString(),

date:val('fin-date')||today(),

type:val('fin-type'),

concept,

subcategory:val('fin-sub').trim(),

amount,

paymentMethod,

accountCard:paymentMethod,

installments:
Math.max(1,n(val('fin-msi'))||1),

note:val('fin-note').trim(),

createdAt:new Date().toISOString(),

syncStatus:
cloudUser
?'pending'
:'local'

};

data.finance.push(movement);

save(false);

if(cloudUser){

let ok=await pushFinance(movement);

movement.syncStatus=
ok
?'synced'
:'error';

save(false);

}

finance();
}

async function pushFinance(x){

if(!sb || !cloudUser){
return false;
}

try{

const {error}=await sb
.from('finance')
.upsert({

id:x.id,

user_id:cloudUser.id,

transaction_date:x.date,

transaction_type:x.type,

concept:x.concept,

subcategory:x.subcategory||null,

amount:n(x.amount),

payment_method:x.paymentMethod||null,

account_card:x.accountCard||null,

installments:
Math.max(1,n(x.installments)||1),

note:x.note||null,

source:'NLT',

updated_at:new Date().toISOString()

},{
onConflict:'id'
});

if(error){
console.error(error);
return false;
}

return true;

}catch(err){

console.error(err);
return false;

}
}

async function retryFinanceSync(){

if(!cloudUser){
return alert('Primero conecta Nate Cloud.');
}

let pending=(data.finance||[])
.filter(x=>
x.syncStatus!=='synced'
);

if(!pending.length){
return alert('No hay movimientos pendientes.');
}

let success=0;
let failed=0;

for(const x of pending){

let ok=await pushFinance(x);

if(ok){
x.syncStatus='synced';
success++;
}else{
x.syncStatus='error';
failed++;
}

}

save(false);

alert(
`Sincronización terminada.\n\n`+
`Correctos: ${success}\n`+
`Con error: ${failed}`
);

settings();
}

async function pullFinance(){

if(!cloudUser){
return alert('Primero conecta Nate Cloud.');
}

try{

const {data:rows,error}=await sb
.from('finance')
.select('*')
.eq('user_id',cloudUser.id)
.order('transaction_date',{
ascending:false
});

if(error){
console.error(error);
return alert(
'No se pudieron descargar los movimientos.'
);
}

let localMap=new Map(
(data.finance||[])
.map(x=>[x.id,x])
);

(rows||[]).forEach(r=>{

localMap.set(r.id,{

id:r.id,

date:r.transaction_date,

type:r.transaction_type,

concept:r.concept,

subcategory:r.subcategory||'',

amount:n(r.amount),

paymentMethod:
r.payment_method||'',

accountCard:
r.account_card||'',

installments:
n(r.installments)||1,

note:r.note||'',

createdAt:r.created_at,

syncStatus:'synced'

});

});

data.finance=[
...localMap.values()
];

save(false);

alert(
`Nate Cloud actualizado: ${rows?.length||0} movimientos encontrados.`
);

finance();

}catch(err){

console.error(err);

alert(
'Error al descargar Nate Cloud.'
);

}
}

function downloadBlob(
blob,
filename
){

let url=
URL.createObjectURL(blob);

let a=
document.createElement('a');

a.href=url;
a.download=filename;

document.body.appendChild(a);

a.click();
a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);
}

function exportJSON(){

let payload={
exportedAt:
new Date().toISOString(),

app:
'Nate Life Tracker',

version:
data.version,

data
};

downloadBlob(
new Blob(
[
JSON.stringify(
payload,
null,
2
)
],
{
type:'application/json'
}
),
`Nate_Life_Tracker_${today()}.json`
);
}

function restoreJSON(file){

if(!file)return;

if(
!confirm(
'Esto reemplazará los datos locales actuales por el backup seleccionado. ¿Continuar?'
)
)return;

let reader=
new FileReader();

reader.onload=()=>{

try{

let parsed=
JSON.parse(reader.result);

let incoming=
parsed.data||parsed;

data=
migrate(incoming);

save(false);

alert(
'Backup restaurado.'
);

go('home');

}catch(err){

console.error(err);

alert(
'El archivo no parece ser un backup válido.'
);

}

};

reader.readAsText(file);
}

async function initCloud(){

if(!sb)return;

try{

const {
data:{
session
}
}=await sb.auth.getSession();

cloudUser=
session?.user||null;

sb.auth.onAuthStateChange(
(_event,session)=>{

cloudUser=
session?.user||null;

if(unlocked()){
render();
}

}
);

}catch(err){

console.error(
'Cloud init:',
err
);

}
}

async function cloudLogin(){

if(!sb){
return alert(
'No se pudo inicializar Nate Cloud.'
);
}

let email=
val('cloud-email').trim();

let password=
val('cloud-password');

if(!email || !password){
return alert(
'Escribe correo y contraseña.'
);
}

try{

const {
data:result,
error
}=await sb.auth.signInWithPassword({
email,
password
});

if(error){
console.error(error);

return alert(
'No se pudo iniciar sesión. Revisa correo y contraseña.'
);
}

cloudUser=
result.user;

await ensureProfile();

alert(
'Nate Cloud conectado.'
);

settings();

}catch(err){

console.error(err);

alert(
'Error al conectar Nate Cloud.'
);

}
}

async function ensureProfile(){

)return;

try{

const {error}=await sb
.from('profiles')
.upsert({

user_id:
cloudUser.id,

display_name:
'Nate',

timezone:
TZ,

updated_at:
new Date().toISOString()

},{
onConflict:
'user_id'
});

if(error){
console.error(
'Profile:',
error
);
}

}catch(err){

console.error(err);

}
}

async function cloudLogout(){

if(!sb)return;

if(
!confirm(
'¿Cerrar la sesión de Nate Cloud en este dispositivo?'
)
)return;

await sb.auth.signOut();

cloudUser=null;

settings();
}

function changePin(){

let pin=
val('new-pin').trim();

if(
!pin ||
pin.length<4 ||
!/^\d+$/.test(pin)
){
return alert(
'Usa un PIN numérico de al menos 4 dígitos.'
);
}

data.pin=pin;

save(false);

alert(
'PIN actualizado.'
);

settings();
}

function navState(){

[
'home',
'plan',
'food',
'progress',
'more'
].forEach(v=>{

let el=$('n-'+v);

if(el){
el.classList.toggle(
'on',
view===v
);
}

});
}

function render(){

if(!unlocked()){
lockScreen();
return;
}

$('nav').classList.remove('hide');

navState();

switch(view){

case 'home':
home();
break;

case 'plan':
plan();
break;

case 'food':
food();
break;

case 'progress':
progressView();
break;

case 'more':
more();
break;

default:
home();
break;

}
}

initCloud().then(
()=>render()
);

</script>
</body>
</html>

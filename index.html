function migrate(){
  let o={};

  try{
    o=JSON.parse(localStorage.getItem(KEY))||{}
  }catch{}

  let d=fresh();

  for(const k of Object.keys(d)){
    if(o[k]!==undefined)d[k]=o[k]
  }

  d.version=2.3;

  d.gymState={
    ...fresh().gymState,
    ...(o.gymState||{})
  };

  d.reading={
    ...fresh().reading,
    ...(o.reading||{})
  };

  d.sync={
    ...fresh().sync,
    ...(o.sync||{})
  };

  if(
    o.macroGoal &&
    o.macroGoal.calories===2400 &&
    o.macroGoal.protein===155 &&
    o.macroGoal.carbs===275 &&
    o.macroGoal.fats===70
  ){
    d.macroGoal=fresh().macroGoal
  }

  return d
}

function progress(a,b){
  let p=b
    ?Math.max(
      0,
      Math.min(
        100,
        Math.round(a/b*100)
      )
    )
    :0;

  return `
    <div class="bar">
      <i style="width:${p}%"></i>
    </div>
  `
}

/* =========================================================
   CONVERSIÓN DE PESOS
   Base histórica = kg
   Interfaz = lb
   ========================================================= */

const KG_TO_LB=2.2046226218;


function kgToLb(kg){
  if(
    kg===null ||
    kg===undefined ||
    kg===''
  ){
    return ''
  }

  const lb=n(kg)*KG_TO_LB;

  /*
    Mostramos hasta 1 decimal para
    conservar compatibilidad con cargas
    históricas sin perder precisión.
  */

  return Math.round(lb*10)/10
}


function lbToKg(lb){
  if(
    lb===null ||
    lb===undefined ||
    lb===''
  ){
    return 0
  }

  return n(lb)/KG_TO_LB
}


function prettyLbFromKg(kg){
  if(!n(kg))return '—';

  return `${kgToLb(kg)} lb`
}


/* =========================================================
   MACROS DEL DÍA
   ========================================================= */

function todaysMacros(){
  let l=data.mealLog[today()]||{};

  let sum={
    k:0,
    p:0,
    c:0,
    f:0
  };

  baseMeals.forEach(m=>{
    let x=l[m.id];

    if(x?.done){
      (x.items||m.items).forEach(
        ([id,q,on=true])=>{
          if(on===false)return;

          let z=foods[id];

          if(z){
            sum.k+=z.k*q;
            sum.p+=z.p*q;
            sum.c+=z.c*q;
            sum.f+=z.f*q
          }
        }
      )
    }
  });

  (l.extras||[]).forEach(x=>{
    sum.k+=n(x.k);
    sum.p+=n(x.p);
    sum.c+=n(x.c);
    sum.f+=n(x.f)
  });

  return sum
}

/* =========================================================

let calCursor=new Date();


function calendar(){

  let y=calCursor.getFullYear();

  let mo=calCursor.getMonth();

  let first=new Date(
    y,
    mo,
    1
  );

  let days=new Date(
    y,
    mo+1,
    0
  ).getDate();

  let start=first.getDay();

  let cells='';


  for(let i=0;i<start;i++){
    cells+=`
      <div class="calday blank"></div>
    `
  }


  for(let d=1;d<=days;d++){

    let ds=
      `${y}-`+
      `${String(mo+1).padStart(2,'0')}-`+
      `${String(d).padStart(2,'0')}`;

    let has=getEvents(ds).length;

    cells+=`
      <button
        class="
          calday
          ${ds===today()?'today':''}
          ${has?'has':''}
        "
        onclick="
          dayAgenda('${ds}')
        ">
        ${d}
      </button>
    `
  }


  $('planbody').innerHTML=`

    <div class="card">

      <div class="row">

        <button
          class="btn sm light"
          onclick="calMove(-1)">
          ←
        </button>

        <b>
          ${
            first.toLocaleDateString(
              'es-MX',
              {
                month:'long',
                year:'numeric'
              }
            )
          }
        </b>

        <button
          class="btn sm light"
          onclick="calMove(1)">
          →
        </button>

      </div>


      <div
        class="calgrid small muted"
        style="
          margin:15px 0 6px;
          text-align:center
        ">

        <b>D</b>
        <b>L</b>
        <b>M</b>
        <b>M</b>
        <b>J</b>
        <b>V</b>
        <b>S</b>

      </div>


      <div class="calgrid">
        ${cells}
      </div>

    </div>


    <button
      class="btn"
      style="
        width:100%;
        margin-top:11px
      "
      onclick="
        newEvent('${today()}')
      ">
      + Agregar evento
    </button>
  `
}


function calMove(x){

  calCursor=
    new Date(
      calCursor.getFullYear(),
      calCursor.getMonth()+x,
      1
    );

  calendar()
}

/* =========================================================
   ÚLTIMO REGISTRO DE EJERCICIO
   ========================================================= */

function lastExercise(name){

  let arr=[];


  Object.entries(
    data.workouts
  ).forEach(
    ([d,w])=>{

      let x=
        w.entries?.[name];

      if(x){

        arr.push({
          d,
          ...x
        })

      }

    }
  );


  return arr
    .sort(
      (a,b)=>
        b.d.localeCompare(a.d)
    )[0]
}


/* =========================================================
   TARJETA DE EJERCICIO
   ========================================================= */

function exercise(
  e,
  i,
  w,
  g
){

  let[
    name,
    sets,
    target,
    rir
  ]=e;


  let x=
    w.entries?.[name]
    ||{};


  let last=
    lastExercise(name);


  let rows='';


  for(
    let s=0;
    s<sets;
    s++
  ){

    let z=
      x.sets?.[s]
      ||{};


    /*
      El valor guardado históricamente
      sigue siendo kg.

      Aquí solamente lo convertimos
      para mostrarlo en lb.
    */

    let displayWeight=
      z.weight
      ?kgToLb(z.weight)
      :'';


    rows+=`

        <div class="setnum">
          ${s+1}
        </div>

          <span class="label">

            step="0.5"

            reps

            style="padding:9px"

            value="${z.reps||''}">

          </span>

          <input

            type="number"
            inputmode="numeric"

      </div>
    `
  }


  return`

                    last.sets?.[0]?.weight
                  )
                }
              </b>

            </div>
          `
          :''

          n(data.gymState.next)%

/* =========================================================
   GUARDAR EJERCICIO
   ========================================================= */

function saveEx(
  i,
  routineName
){

  const g=
    gymRoutine.find(
      x=>x.name===routineName
    );


  if(!g){
    return
  }


  /*
    Protección:
    únicamente se puede registrar
    la rutina que realmente sigue.
  */

  if(
    g.name!==
    nextGym().name
  ){

    alert(
      `Tu siguiente entrenamiento es ${nextGym().name}. `+
      `Puedes consultar ${g.name}, pero no registrar esa sesión todavía.`
    );

    return
  }


  let e=g.ex[i];

  let t=today();


  /*
    Si hoy ya existe otra rutina,
    no mezclamos sus ejercicios.
  */

  if(
    data.workouts[t] &&
    data.workouts[t].routine!==g.name &&
    !data.workouts[t].completed
  ){
    data.workouts[t]={
      routine:g.name,
      entries:{},
      completed:false
    }
  }


  data.workouts[t]=
    data.workouts[t]
    ||{
      routine:g.name,
      entries:{},
      completed:false
    };


  let sets=[];


  for(
    let s=0;
    s<e[1];
    s++
  ){

    const lb=
      val(`g-${i}-${s}-w`);


    sets.push({

      /*
        Usuario captura libras.
        Guardamos kg para mantener
        compatibilidad histórica.
      */

      weight:
        lb
        ?lbToKg(lb)
        :0,

      reps:
        n(
          val(`g-${i}-${s}-r`)
        ),

      rir:
        n(
          val(`g-${i}-${s}-i`)
        )

    })
  }


  data.workouts[t]
    .entries[e[0]]={

      sets,

      target:e[2],

      /*
        Metadato nuevo.
        Nos permite saber que esta
        captura fue realizada en lb.
      */

      inputUnit:'lb'

    };


  save(false);

  gym()
}


/* =========================================================
   COMPLETAR ENTRENAMIENTO
   ========================================================= */

function completeWorkout(){

  let t=today();

  let g=nextGym();


  data.workouts[t]=
    data.workouts[t]
    ||{
      routine:g.name,
      entries:{}
    };


  /*
    Protección adicional por si
    existiera una sesión provisional
    de otra rutina.
  */

  if(
    data.workouts[t].routine!==g.name
  ){

    data.workouts[t]={
      routine:g.name,
      entries:{}
    }

  }


  data.workouts[t]
    .completed=true;


  data.gymAttendance[t]=
    'completed';


  /*
    ESTA es la única operación que
    avanza la secuencia.
  */

  data.gymState.next=
    (
      n(data.gymState.next)+1
    )%
    gymRoutine.length;


  /*
    Después de completar volvemos
    automáticamente a la siguiente.
  */

  data.gymState.viewing=null;


  save(false);

  plan('gym')
}

/* =========================================================
   MACROS DE UNA COMIDA
   ========================================================= */

function mealMacros(items){

  let s={
    k:0,
    p:0,
    c:0,
    f:0
  };


  items.forEach(
    ([id,q,on=true])=>{

      if(on===false)return;


      let z=foods[id];


      if(z){

        s.k+=z.k*q;

        s.p+=z.p*q;

        s.c+=z.c*q;

        s.f+=z.f*q

      }

    }
  );


  return s
}

}

function dbAllPhotos(){

  return new Promise(
    res=>{

      let q=
        photoDB
        .transaction(
          'photos'
        )
        .objectStore(
          'photos'
        )
        .getAll();


      q.onsuccess=()=>res(

        q.result.sort(
          (a,b)=>
            b.date.localeCompare(a.date)
        )

      );


      q.onerror=()=>res([])

    }
  )
}


async function addPhoto(ev){

  let file=
    ev.target.files[0];


  if(!file)return;


  let type=
    prompt(
      'Tipo: frente, perfil o espalda',
      'frente'
    )
    ||'frente';


  await dbOpen();


  let tx=
    photoDB.transaction(
      'photos',
      'readwrite'
    );


  tx
    .objectStore(
      'photos'
    )
    .put({

      id:
        Date.now().toString(),

      date:
        today(),

      type,

      blob:file

    });


  tx.oncomplete=()=>photos()
}

/* =========================================================
   DETECTOR DE DUPLICADOS
   ========================================================= */

function cleanFinanceText(x){

  return String(x||'')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,' ')
}


function findFinanceDuplicate(candidate){

  const now=
    Date.now();


  return data.finance.find(
    x=>{

      const sameCore=

        normalizeFinanceType(x.type)
          ===normalizeFinanceType(candidate.type)

        &&

        String(x.date||'')
          ===String(candidate.date||'')

        &&

        cleanFinanceText(
          x.concept||x.category
        )
          ===
        cleanFinanceText(
          candidate.concept||candidate.category
        )

        &&

        cleanFinanceText(
          x.subconcept
        )
          ===
        cleanFinanceText(
          candidate.subconcept
        )

        &&

        cleanFinanceText(
          x.payment||x.method
        )
          ===
        cleanFinanceText(
          candidate.payment||candidate.method
        )

        &&

        Math.abs(
          n(x.amount)-
          n(candidate.amount)
        )<0.001;


      /*
        Si existe createdAt,
        usamos una ventana corta.

        Los movimientos antiguos de 2.2
        pueden no tener createdAt.
        En ese caso el sistema avisa
        si el núcleo coincide exactamente.
      */

      const recent=
        !x.createdAt
        ||
        (
          now-
          n(x.createdAt)
        )<
        5*60*1000;


      return(
        sameCore
        &&
        recent
      )
    }
  )
}

/* =========================================================
   ELIMINAR MOVIMIENTO
   ========================================================= */

async function deleteFinance(id){

  const index=
    data.finance.findIndex(
      x=>x.id===id
    );


  if(index<0)return;


  const x=
    data.finance[index];


  const ok=
    confirm(
      `¿Eliminar este movimiento?\n\n`+
      `${x.subconcept||x.concept||'Movimiento'}\n`+
      `${money(x.amount)}`
    );


  if(!ok)return;


  /*
    Conservamos copia temporal
    para permitir Deshacer.
  */

  deletedFinance=
    JSON.parse(
      JSON.stringify(x)
    );


  data.finance.splice(
    index,
    1
  );


  data.sync.queue=
    data.sync.queue.filter(
      z=>z!==id
    );


  save(false);


  /*
    Eliminamos también de Supabase.
  */

  if(
    sb &&
    cloudUser
  ){

    try{

      const {error}=
        await sb
          .from('finance')
          .delete()
          .eq('id',id)
          .eq(
            'user_id',
            cloudUser.id
          );


      if(error){
        throw error
      }

    }catch(e){

      console.warn(
        'Delete finance cloud',
        e
      );


      alert(
        'Se eliminó localmente, pero Nate Cloud no confirmó la eliminación. Revisa tu conexión antes de continuar.'
      )

    }

  }


  clearTimeout(
    deletedFinanceTimer
  );


  /*
    Ventana de 10 segundos
    para Deshacer.
  */

  deletedFinanceTimer=
    setTimeout(
      ()=>{

        deletedFinance=null;

        if(
          unlocked() &&
          view==='more'
        ){
          /*
            No forzamos navegación.
          */
        }

      },
      10000
    );


  finance()
}


/* =========================================================
   DESHACER ELIMINACIÓN
   ========================================================= */

async function undoDeleteFinance(){

  if(!deletedFinance){
    return
  }


  const restored=
    JSON.parse(
      JSON.stringify(
        deletedFinance
      )
    );


  restored.syncStatus=
    'pending';


  restored.updatedAt=
    Date.now();


  data.finance.push(
    restored
  );


  queueFinanceSync(
    restored.id
  );


  deletedFinance=null;


  clearTimeout(
    deletedFinanceTimer
  );


  save(false);


  await syncFinance();


  finance()
}

/* =========================================================
   MAPEO MÉTODO DE PAGO PARA SUPABASE
   ========================================================= */

function supabasePaymentMethod(
  paymentName
){

  if(
    paymentName==='Efectivo'
  ){
    return 'Efectivo'
  }


  if(
    paymentName==='Transferencia'
  ){
    return 'Transferencia'
  }


  if(
    paymentName==='Pluxee'
  ){
    return 'Vales'
  }


  return 'Tarjeta'
}


/* =========================================================
   SINCRONIZAR FINANZAS
   ========================================================= */

async function syncFinance(){

  if(
    !sb||
    !navigator.onLine
  ){
    return
  }


  if(!cloudUser){

    try{

      let{
        data:{
          session
        }
      }=
        await sb.auth.getSession();


      cloudUser=
        session?.user
        ||null;

    }catch{}


    if(!cloudUser){
      return
    }
  }


  for(
    const id
    of[
      ...data.sync.queue
    ]
  ){

    let x=
      data.finance.find(
        z=>z.id===id
      );


    /*
      Si ya no existe localmente,
      quitamos el ID de la cola.
    */

    if(!x){

      data.sync.queue=
        data.sync.queue.filter(
          z=>z!==id
        );

      continue
    }


    let row={

      id:
        x.id,

      user_id:
        cloudUser.id,

      transaction_date:
        x.date||today(),

      transaction_type:
        normalizeFinanceType(
          x.type
        ).toLowerCase(),

      concept:
        x.concept
        ||x.category
        ||'Otros',

      subcategory:
        x.subconcept
        ||null,

      amount:
        n(x.amount),

      payment_method:
        supabasePaymentMethod(
          x.payment||x.method
        ),

      account_card:
        x.payment
        ||x.method
        ||null,

      installments:
        n(x.msi)
        ||1,

      note:
        x.note
        ||null,

      source:
        'NLT'

    };


    try{

      let{
        error
      }=
        await sb
          .from('finance')
          .upsert(
            row,
            {
              onConflict:'id'
            }
          );


      if(error){
        throw error
      }


      x.syncStatus=
        'synced';


      data.sync.queue=
        data.sync.queue.filter(
          z=>z!==id
        );


      save(false);

    }catch(e){

      console.warn(
        'Sync finance',
        e
      );


      x.syncStatus=
        'error';


      save(false);


      break
    }
  }
}

/* =========================================================
   IMPORTAR JSON
   ========================================================= */

function importJSON(e){

  let f=
    e.target.files[0];


  if(!f)return;


  let r=
    new FileReader();


  r.onload=()=>{

    try{

      let x=
        JSON.parse(
          r.result
        );


      if(
        confirm(
          '¿Reemplazar datos actuales?'
        )
      ){

        data={
          ...fresh(),
          ...x
        };


        data.version=2.3;


        save();


        alert(
          'Restaurado'
        )

      }

    }catch{

      alert(
        'Backup inválido'
      )

    }

  };


  r.readAsText(f)
}


/* =========================================================
   DESCARGAR ARCHIVO
   ========================================================= */

function dl(blob,name){

  let a=
    document.createElement(
      'a'
    );


  a.href=
    URL.createObjectURL(
      blob
    );


  a.download=
    name;


  a.click();


  setTimeout(
    ()=>
      URL.revokeObjectURL(
        a.href
      ),
    500
  )
}

    gymRows
  );


  let nr=[];


  Object.entries(
    data.mealLog
  ).forEach(
    ([Fecha,l])=>

      baseMeals.forEach(
        m=>{

          let x=
            l[m.id];


          if(x?.done){

            let z=
              mealMacros(
                x.items||m.items
              );


            nr.push({

              Fecha,

              Comida:
                m.name,

              Calorias:
                Math.round(z.k),

              Proteina:
                +z.p.toFixed(1),

              Carbs:
                +z.c.toFixed(1),

              Grasas:
                +z.f.toFixed(1),

              Nota:
                x.note||''

            })

          }

        }
      )

  );


  add(
    'Nutricion',
    nr
  );


  XLSX.writeFile(
    wb,
    `Nate_Life_Tracker_${today()}.xlsx`
  )
}


/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */

function render(){

  if(
    !unlocked()
  ){

    return lockScreen()

  }


  $('nav')
    .classList
    .remove('hide');


  document
    .querySelectorAll(
      '.nav button'
    )
    .forEach(
      x=>
        x.classList.remove(
          'on'
        )
    );


  let id={

    home:'n-home',

    plan:'n-plan',

    food:'n-food',

    progress:'n-progress',

    more:'n-more'

  }[view];


  if($(id)){

    $(id)
      .classList
      .add('on')

  }


  if(view==='home'){
    home()
  }


  if(view==='plan'){
    plan()
  }


  if(view==='food'){
    food()
  }


  if(view==='progress'){
    progressView()
  }


  if(view==='more'){
    more()
  }
}


/* =========================================================
   EVENTOS GLOBALES
   ========================================================= */

window.addEventListener(
  'online',
  syncFinance
);


if(sb){

  sb.auth.onAuthStateChange(
    (_e,session)=>{

      cloudUser=
        session?.user
        ||null

    }
  )

}


/* =========================================================
   INICIO
   ========================================================= */

save(false);

render();

cloudInit();

</script>

<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="apple-touch-icon" href="/icon.jpeg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nate Life Tracker" />
  <title>Nate Life Tracker 2.1</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --ink:#171915;
      --ivory:#f5f2e9;
      --paper:#fffdf8;
      --olive:#626a4d;
      --muted:#7b7d75;
      --line:rgba(23,25,21,.09)
    }

    *{
      -webkit-tap-highlight-color:transparent;
      box-sizing:border-box
    }

    html{
      background:var(--ivory)
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top right,#ece8d9 0,transparent 28%),
        var(--ivory);
      color:var(--ink)
    }

    .safe-bottom{
      padding-bottom:calc(104px + env(safe-area-inset-bottom))
    }

    .glass{
      background:rgba(245,242,233,.88);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px)
    }

    .tab-active{
      background:var(--ink);
      color:#fff;
      box-shadow:0 8px 24px rgba(23,25,21,.16)
    }

    .tab-inactive{
      background:transparent;
      color:#74766f
    }

    input,select,textarea{
      font-size:16px!important;
      background:#fffdf8!important;
      border-color:var(--line)!important
    }

    .bar{
      height:7px;
      border-radius:999px;
      background:#e7e3d8;
      overflow:hidden
    }

    .bar>span{
      display:block;
      height:100%;
      background:var(--olive);
      border-radius:999px
    }

    .hide{
      display:none!important
    }

    .premium-card{
      background:rgba(255,253,248,.92);
      border:1px solid var(--line);
      box-shadow:0 12px 35px rgba(40,39,31,.055)
    }

    .hero{
      background:linear-gradient(145deg,#171915,#2b2e25);
      box-shadow:0 18px 42px rgba(23,25,21,.18)
    }

    button{
      transition:transform .12s ease,opacity .12s ease
    }

    button:active{
      transform:scale(.98)
    }

    .nav-icon{
      display:block;
      margin:0 auto 3px;
      width:19px;
      height:19px
    }

    .lock-orb{
      width:78px;
      height:78px;
      border-radius:28px;
      background:linear-gradient(145deg,#252820,#11130f);
      display:grid;
      place-items:center;
      box-shadow:0 18px 50px rgba(23,25,21,.22)
    }
  </style>
</head>

<body class="bg-[#e9e5da] text-slate-950">

<main class="max-w-md mx-auto min-h-screen safe-bottom px-4 pt-5">
  <section id="app"></section>
</main>

const mealPlan=[

function fresh(){

  return{
    version:2.1,
    pin:DEFAULT_PIN,
    gymAttendance:{},
    workouts:{},
    progress:[],
    cardio:{},
    macroGoal:{
      calories:2400,
      protein:155,
      carbs:275,
      fats:70
    },
    macroLog:{},
    meals:{},
    body:{},
    sleep:{},
    faith:{},
    finance:[],
    budgets:{},
    settings:{
      returnPhaseStart:today()
    }
  };

}

function migrate(){

  let old={};

  try{
    old=JSON.parse(
      localStorage.getItem('nlt-pro')
    )||{};
  }
  catch(e){}

  const n=fresh();

  [
    'gymAttendance',
    'workouts',
    'progress',
    'cardio',
    'macroLog',
    'meals',
    'body',
    'sleep',
    'faith',
    'finance',
    'budgets'
  ].forEach(k=>{
    if(old[k]!==undefined){
      n[k]=old[k];
    }
  });

  if(old.pin){
    n.pin=old.pin;
  }

  if(old.macroGoal){
    n.macroGoal=old.macroGoal;
  }

  if(old.settings){
    n.settings={
      ...n.settings,
      ...old.settings
    };
  }

  return n;

}

let data=migrate();

localStorage.setItem(
  'nlt-pro',
  JSON.stringify(data)
);

let view=
  localStorage.getItem('nlt-view-v21')
  ||
  'inicio';

function save(renderAgain=true){

  localStorage.setItem(
    'nlt-pro',
    JSON.stringify(data)
  );

  if(renderAgain){
    render();
  }

}

function val(id){
  return document.getElementById(id)?.value||'';
}

function app(html){
  document.getElementById('app').innerHTML=html;
}

function section(title,sub=''){

  return`
    <div class="mb-5">
      <h1 class="text-[30px] leading-none font-black tracking-[-.035em]">
        ${title}
      </h1>

      ${
        sub
        ?
        `<p class="text-[#7b7d75] text-sm mt-2">${sub}</p>`
        :
        ''
      }
    </div>
  `;

}

function card(title,value,sub=''){

  return`
    <div class="premium-card rounded-[26px] p-4">

        ${value}
      </p>

      <p class="text-xs text-[#7b7d75] mt-1">

      </p>
    </div>
  `;

}

function input(label,id,value='',type='text',placeholder=''){

  return`
    <label class="block">
      <span class="text-[11px] uppercase tracking-[.1em] font-black text-[#7b7d75]">
        ${label}
      </span>

      <input
        id="${id}"
        type="${type}"
        value="${esc(value)}"
        placeholder="${placeholder}"
        class="mt-1 w-full rounded-2xl border px-4 py-3 outline-none focus:ring-2 focus:ring-[#626a4d]"
      >
    </label>
  `;

}

function pill(text,active,click){

  return`
    <button
      onclick="${click}"
      class="px-4 py-2 rounded-full whitespace-nowrap text-sm font-black ${
        active
        ?
        'bg-[#171915] text-white'
        :
        'bg-[#fffdf8] text-[#7b7d75] border border-black/5'
      }"
    >
      ${text}
    </button>
  `;

}

function pct(a,b){
  return b?clamp(Math.round(a/b*100)):0;
}

function bar(a,b){

  return`
    <div class="bar mt-2">
      <span style="width:${pct(a,b)}%"></span>
    </div>
  `;

}

function dayName(date=today()){

  const [y,m,d]=date.split('-').map(Number);

  return DAYS[
    new Date(y,m-1,d).getDay()
  ];

}

function planFor(date=today()){

  return routineV2.find(
    r=>r.day===dayName(date)
  )||null;

}

function isUnlocked(){
  return sessionStorage.getItem('nlt-unlocked')==='1';
}

function lock(){

  sessionStorage.removeItem('nlt-unlocked');

  render();

}

function unlock(){

  const pin=val('pin-entry');

  if(pin===String(data.pin||DEFAULT_PIN)){

    sessionStorage.setItem(
      'nlt-unlocked',
      '1'
    );

    render();

  }else{

    const el=document.getElementById('pin-error');

    if(el){
      el.textContent='PIN incorrecto';
    }

  }

}

function setView(v){

function gym(tab='hoy'){

  app(`
    ${section(
      'Entrenar',
      '50 minutos. Calidad, progresión y consistencia.'
    )}

    <div class="flex gap-2 overflow-x-auto mb-5">
      ${pill('Hoy',tab==='hoy',"gym('hoy')")}
      ${pill('Rutina',tab==='rutina',"gym('rutina')")}
      ${pill('Historial',tab==='historial',"gym('historial')")}
      ${pill('Cardio',tab==='cardio',"gym('cardio')")}
    </div>

    <div id="gym-content"></div>
  `);

  if(tab==='hoy')gymToday();
  if(tab==='rutina')gymRoutine();
  if(tab==='historial')gymHistory();
  if(tab==='cardio')cardio();

}

function phaseSets(sets){

  const start=new Date(
    (data.settings.returnPhaseStart||today())+'T12:00:00'
  );

  const now=new Date(
    today()+'T12:00:00'
  );

  const days=Math.floor(
    (now-start)/86400000
  );

  return days<14
    ?
    Math.min(2,sets)
    :
    sets;

}

function gymToday(){

  const t=today();
  const plan=planFor(t);
  const w=data.workouts[t]||{
    entries:[],
    completed:false
  };

  const el=document.getElementById('gym-content');

  if(!plan){

    el.innerHTML=`
      <div class="premium-card rounded-[28px] p-5">

        <h2 class="text-xl font-black">
          Sin pesas programadas.

        <p class="text-sm text-[#7b7d75] mt-2">

            dayName()==='Domingo'
            ?
            'Fútbol + recuperación.'
            :
            'Sábado funciona como recuperación opcional si perdiste una sesión.'
          }

      </div>
    `;

    return;
  }

  el.innerHTML=`
    <div class="hero text-white rounded-[30px] p-5 mb-4">

      <p class="text-xs text-white/55">
        ${plan.day}
      </p>

      <h2 class="text-2xl font-black mt-1">
        ${plan.name}
      </h2>

      <p class="text-sm text-white/60">
        ${plan.focus}
      </p>

      <div class="mt-4 flex gap-2 text-[11px]">

        <span class="bg-white/10 rounded-full px-3 py-2">
          50 min
        </span>

        <span class="bg-white/10 rounded-full px-3 py-2">
          RIR 1–2
        </span>

        <span class="bg-white/10 rounded-full px-3 py-2">
          Progresión doble
        </span>

      </div>

    </div>

    <div class="space-y-3">
      ${
        plan.ex.map(
          (e,i)=>exerciseCard(e,i,w)
        ).join('')
      }
    </div>

    <button
      onclick="finishWorkout()"
      class="w-full mt-4 ${
        w.completed
        ?
        'bg-[#626a4d]'
        :
        'bg-[#171915]'
      } text-white rounded-[22px] py-4 font-black">

      ${
        w.completed
        ?
        'Sesión completada ✓'
        :
        'Finalizar sesión'
      }

    </button>
  `;

}

function lastExercise(name){

  const rows=[];

  Object.entries(data.workouts).forEach(
    ([date,w])=>{

      const e=(w.entries||[]).find(
        x=>x.exercise===name
      );

      if(e){
        rows.push({
          date,
          ...e
        });

function saveExercise(i){

  const t=today();
  const plan=planFor(t);
  const e=plan.ex[i];

  data.workouts[t]=data.workouts[t]||{
    entries:[],
    completed:false
  };

  data.workouts[t].entries=
    data.workouts[t].entries||[];

  const entry={
    exercise:e[0],
    muscle:e[1],
    weight:val(`w-${i}`),
    reps:val(`r-${i}`),
    rir:val(`rir-${i}`),
    sets:phaseSets(e[2]),
    targetReps:e[3],
    rest:e[4]
  };

  data.workouts[t].entries=
    data.workouts[t].entries.filter(
      x=>x.exercise!==e[0]
    );

  data.workouts[t].entries.push(entry);

  save(false);
  gym('hoy');

}

function trend(){

  const entries=Object.entries(data.body)
    .filter(([,b])=>b.weight)
    .sort((a,b)=>a[0].localeCompare(b[0]));

  const recent=entries.slice(-7);

  const avg=recent.length
    ?
    (
      recent.reduce(
        (s,[,b])=>s+num(b.weight),
        0
      )/recent.length
    ).toFixed(1)
    :
    '—';

  const waistEntry=[...entries]
    .reverse()
    .find(([,b])=>b.waist);

  const waist=waistEntry?.[1]?.waist||'—';

  document.getElementById('health-content').innerHTML=`
    <div class="grid grid-cols-2 gap-3">

      ${card(
        'PESO PROM.',
        avg==='—'?'—':avg+' kg',
        recent.length+' registros'
      )}

      ${card(
        'CINTURA',
        waist==='—'?'—':waist+' cm',
        'Último registro'
      )}

    </div>

    <div class="premium-card rounded-[28px] p-5 mt-4">

      <h2 class="font-black text-xl">
        Historial
      </h2>

      <div class="mt-3">

        ${
          entries.length
          ?
          entries.slice(-15).reverse().map(([d,b])=>`
            <div class="flex justify-between py-3 border-t border-black/5">

              <span class="text-sm text-[#7b7d75]">
                ${d}
              </span>

              <b class="text-sm">
                ${b.weight} kg
                ${b.waist?' · '+b.waist+' cm':''}
              </b>

            </div>
          `).join('')
          :
          `<p class="text-sm text-[#7b7d75]">Sin datos todavía.</p>`
        }

      </div>

    </div>
  `;

}

    )}

    <div class="space-y-3">

      ${menuCard(
        'Exportar Excel',
        'Genera un .xlsx con hojas separadas.',
        'exportExcel()'
      )}

      ${menuCard(
        'Backup JSON',
        'Copia completa para restaurar la app.',
        'exportJSON()'
      )}

      <div class="premium-card rounded-[26px] p-5">

        <h2 class="font-black">
          Restaurar backup
        </h2>

        <p class="text-sm text-[#7b7d75] mt-1">
          Selecciona un archivo JSON exportado por Nate Life Tracker.
        </p>

        <input
          type="file"
          accept=".json,application/json"
          onchange="importJSON(event)"
          class="mt-4 w-full"
        >

      </div>

    </div>
  `);

}

function securityScreen(){

  app(`
    ${backButton()}
    ${section(
      'Seguridad',
      'PIN local de acceso.'
    )}

    <div class="premium-card rounded-[28px] p-5">

      ${input(
        'Nuevo PIN',
        'new-pin',
        '',
        'password',
        '4–8 dígitos'
      )}

      <button
        onclick="changePin()"
        class="w-full bg-[#171915] text-white rounded-2xl py-3 mt-3 font-black">
        Cambiar PIN
      </button>

      <button
        onclick="lock()"
        class="w-full bg-[#ebe7dc] rounded-2xl py-3 mt-3 font-black">
        Bloquear ahora
      </button>

    </div>

    <p class="text-xs text-[#7b7d75] mt-4 px-2">
      El PIN protege la interfaz local, pero no es cifrado de seguridad bancaria.
    </p>
  `);

}

function changePin(){

  const p=val('new-pin').trim();

  if(!/^\d{4,8}$/.test(p)){
    alert('Usa un PIN de 4 a 8 dígitos.');
    return;
  }

  data.pin=p;

  save(false);

  alert('PIN actualizado.');

  securityScreen();

}

function exportJSON(){

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );

  downloadBlob(
    blob,
    `Nate_Life_Tracker_Backup_${today()}.json`
  );

}

function importJSON(event){

  const file=event.target.files?.[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{

    try{

      const imported=JSON.parse(reader.result);

      if(!imported||typeof imported!=='object'){
        throw new Error();
      }

      if(!confirm(
        'Esto reemplazará los datos actuales de Nate Life Tracker. ¿Continuar?'
      )){
        return;
      }

      data={
        ...fresh(),
        ...imported
      };

      save(false);

      alert('Backup restaurado.');

      setView('inicio');

    }catch(e){

      alert('El archivo no es un backup válido.');

    }

  };

  reader.readAsText(file);

}

function downloadBlob(blob,name){

  const a=document.createElement('a');

  a.href=URL.createObjectURL(blob);
  a.download=name;

  document.body.appendChild(a);

  a.click();

  setTimeout(()=>{
    URL.revokeObjectURL(a.href);
    a.remove();
  },500);

}

function exportExcel(){

  if(typeof XLSX==='undefined'){

    alert(
      'No se pudo cargar el módulo de Excel. Revisa tu conexión a internet.'
    );

    return;
  }

  const wb=XLSX.utils.book_new();

  const summary=[
    ['Nate Life Tracker 2.1'],
    ['Exportado',today()],
    [],
    ['Objetivo calorías',data.macroGoal.calories],
    ['Objetivo proteína',data.macroGoal.protein],
    ['Objetivo carbohidratos',data.macroGoal.carbs],
    ['Objetivo grasas',data.macroGoal.fats]
  ];

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.aoa_to_sheet(summary),
    'Resumen'
  );

  const gymRows=[];

  Object.entries(data.workouts).forEach(
    ([date,w])=>{

      gymRows.push({
        Fecha:date,
        Dia:dayName(date),
        Rutina:planFor(date)?.name||'',
        Completada:w.completed?'Sí':'No'
      });

    }
  );

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(gymRows),
    'Gym Sesiones'
  );

  const setRows=[];

  Object.entries(data.workouts).forEach(
    ([date,w])=>{

      (w.entries||[]).forEach(x=>{

        setRows.push({
          Fecha:date,
          Rutina:planFor(date)?.name||'',
          Ejercicio:x.exercise||'',
          Musculo:x.muscle||'',
          PesoKg:x.weight||'',
          Reps:x.reps||'',
          RIR:x.rir||'',
          Series:x.sets||'',
          ObjetivoReps:x.targetReps||'',
          Descanso:x.rest||''
        });

      });

    }
  );

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(setRows),
    'Gym Ejercicios'
  );

  const cardioRows=Object.entries(data.cardio).map(
    ([date,x])=>({
      Fecha:date,
      Minutos:x.minutes||'',
      Actividad:x.type||'',
      Intensidad:x.intensity||''
    })
  );

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(cardioRows),
    'Cardio'
  );

  const nutritionRows=Object.entries(data.macroLog).map(
    ([date,x])=>({
      Fecha:date,
      Calorias:x.calories||'',
      Proteina:x.protein||'',
      Carbohidratos:x.carbs||'',
      Grasas:x.fats||''
    })
  );

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(nutritionRows),
    'Nutricion'
  );

  const bodyRows=Object.entries(data.body).map(
    ([date,x])=>({
      Fecha:date,
      PesoKg:x.weight||'',
      CinturaCm:x.waist||'',
      Nota:x.note||''
    })
  );

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(bodyRows),
    'Cuerpo'
  );

  const sleepRows=Object.entries(data.sleep).map(
    ([date,x])=>({
      Fecha:date,
      Horas:x.hours||'',
      HoraDormir:x.bed||'',
      Calidad:x.quality||''
    })
  );

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(sleepRows),
    'Sueño'
  );

  const faithRows=Object.entries(data.faith).map(
    ([date,x])=>({
      Fecha:date,
      Oracion:x.prayed?'Sí':'No',
      Examen:x.exam?'Sí':'No',
      Misa:x.mass?'Sí':'No',
      Rosario:x.rosary?'Sí':'No',
      Santisimo:x.adoration?'Sí':'No',
      Nota:x.note||''
    })
  );

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(faithRows),
    'Fe'
  );

  const financeRows=data.finance.map(x=>({
    Fecha:x.date||'',
    Tipo:x.type||'',
    Concepto:x.concept||x.description||'',
    Categoria:x.category||'',
    Monto:num(x.amount)
  }));

  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(financeRows),
    'Finanzas'
  );

  XLSX.writeFile(
    wb,
    `Nate_Life_Tracker_${today()}.xlsx`
  );

}

function render(){

  if(!isUnlocked()){

    lockScreen();

    return;

  }

  document
    .getElementById('bottom-nav')
    .classList.remove('hide');

  document
    .querySelectorAll('.nav')
    .forEach(b=>{
      b.className=
        'nav rounded-2xl py-2 text-[10px] font-bold tab-inactive';
    });

  const active=
    document.getElementById(
      'nav-'+view
    );

  if(active){

    active.className=
      'nav rounded-2xl py-2 text-[10px] font-bold tab-active';

  }

  if(view==='inicio')inicio();
  if(view==='gym')gym();
  if(view==='nutricion')nutricion();
  if(view==='salud')salud();
  if(view==='mas')mas();

}

render();

</script>

</body>
</html>

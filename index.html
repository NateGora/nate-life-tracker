function mealMacros(items){let s={k:0,p:0,c:0,f:0};(items||[]).forEach(([id,q,on=true])=>{if(on===false)return;let z=foods[id];if(z){s.k+=z.k*n(q);s.p+=z.p*n(q);s.c+=z.c*n(q);s.f+=z.f*n(q)}});return s}

function dayFoodMacros(t){
  let z={k:0,p:0,c:0,f:0},log=data.mealLog[t]||{};
  baseMeals.forEach(m=>{
    let x=log[m.id];
    if(!x?.done)return;
    let mm=mealMacros(x.items||m.items);
    z.k+=mm.k;z.p+=mm.p;z.c+=mm.c;z.f+=mm.f;
  });
  (log.extras||[]).forEach(x=>{z.k+=n(x.k);z.p+=n(x.p);z.c+=n(x.c);z.f+=n(x.f)});
  return z;
}

async function pullFinanceFromExcel(renderAfter=true){
  if(!sb||!navigator.onLine){
    financeCloudError='Sin conexión · mostrando la última copia de Excel.';
    if(renderAfter&&view==='finance')finance();
    return false;
  }
  financeCloudLoading=true; financeCloudError='';
  if(renderAfter&&view==='finance')finance();
  try{
    if(!cloudUser){
      let {data:{session}}=await sb.auth.getSession();
      cloudUser=session?.user||null;
    }
    if(!cloudUser)throw new Error('Inicia sesión en Nate Cloud para leer Excel.');
    const {data:r,error}=await sb.functions.invoke('get-finance-dashboard',{body:{}});
    if(error)throw error;
    if(!r?.success)throw new Error(r?.error||'Excel no devolvió datos.');
    const rows=Array.isArray(r.movements)?r.movements:[];
    data.finance=rows.map(x=>({
      id:x.id,date:x.date,
      month:x.date?dateObj(x.date).toLocaleDateString('es-MX',{month:'long',year:'numeric'}):'',
      type:x.type==='Ingreso'?'Ingreso':'Gasto',
      category:x.concept||x.category||'Otros',
      concept:x.concept||x.category||'Otros',
      subconcept:x.subconcept||'',
      amount:n(x.amount),
      payment:x.payment||x.method||'',
      method:x.payment||x.method||'',
      msi:1,note:x.note||'',source:'excel',
      excelRow:x.excel_row||null,syncStatus:'excel'
    }));
    financeCloudLoaded=true;
    financeExcelUpdatedAt=r.updated_at||new Date().toISOString();
    save(false);
    return true;
  }catch(e){
    console.warn('Excel dashboard',e);
    financeCloudError=e?.message||String(e);
    return false;
  }finally{
    financeCloudLoading=false;
    // Do not let an async Excel refresh overwrite another active module.
    if(renderAfter&&view==='finance')finance();
  }
}
async function pullFinanceFromCloud(renderAfter=true){return pullFinanceFromExcel(renderAfter)}
async function openFinance(){
  finance();
  if(cloudUser||sb)await pullFinanceFromExcel(true);
}

function finance(){let pend=data.sync.queue.length,stamp=financeExcelUpdatedAt?new Date(financeExcelUpdatedAt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'',status=financeCloudLoading?'Actualizando desde Excel…':financeCloudError?financeCloudError:financeCloudLoaded?`Actualizado desde Excel${stamp?' · '+stamp:''}`:cloudUser?'Excel conectado · toca ↻ para actualizar':'Inicia sesión en Nate Cloud para leer Excel';$('app').innerHTML=`${back()}${section('Finanzas','Excel es la fuente de verdad del Dashboard. Los movimientos creados en NLT siguen viajando por Nate Cloud hacia Excel.')}<div class="notice small row"><span><span class="syncdot ${financeCloudLoading||pend?'pending':financeCloudLoaded?'ok':''}"></span> ${esc(status)}</span>${cloudUser&&!financeCloudLoading?`<button class="btn sm light" onclick="pullFinanceFromExcel(true)">↻</button>`:''}</div>${pend?`<div class="notice small" style="margin-top:8px">${pend} movimiento(s) de NLT pendientes de sincronizar.</div>`:''}${lastDeletedFinance?`<div class="notice small row" style="margin-top:8px"><span>Movimiento eliminado.</span><button class="btn sm light" onclick="undoDeleteFinance()">Deshacer</button></div>`:''}${financeTabs()}${financeTab==='summary'?financeSummaryHTML():financeTab==='calendar'?financeCalendarHTML():financeMovesHTML()}`}
function financeFingerprint(x){return [x.date,(x.type||'Gasto').toLowerCase(),x.concept||x.category||'',String(x.subconcept||'').trim().toLowerCase(),n(x.amount).toFixed(2),x.payment||x.method||''].join('|')}
function saveFinance(){let type=val('fi-type'),concept=val('fi-concept'),x={id:editingFinanceId||crypto.randomUUID?.()||Date.now().toString(),date:val('fi-date')||today(),month:dateObj(val('fi-date')||today()).toLocaleDateString('es-MX',{month:'long',year:'numeric'}),type,category:concept,concept,subconcept:val('fi-sub').trim(),amount:n(val('fi-amt')),payment:val('fi-pay'),method:val('fi-pay'),msi:n(val('fi-msi')),note:val('fi-note'),syncStatus:'pending'};if(!x.amount)return alert('Agrega un monto.');let dup=data.finance.find(z=>z.id!==x.id&&financeFingerprint(z)===financeFingerprint(x));if(dup&&!confirm('Ya existe un movimiento igual (misma fecha, tipo, concepto, subconcepto, monto y método). ¿Guardarlo de todos modos?'))return;if(editingFinanceId){let i=data.finance.findIndex(z=>z.id===editingFinanceId);if(i>=0)data.finance[i]={...data.finance[i],...x}}else data.finance.push(x);if(!data.sync.queue.includes(x.id))data.sync.queue.push(x.id);let wasEditing=!!editingFinanceId;editingFinanceId=null;financeDraftDate=null;financeMonth=x.date.slice(0,7);financeSelectedDate=x.date;save(false);finance();showToast(wasEditing?'Movimiento actualizado con éxito':'Movimiento guardado con éxito');syncFinance().then(async()=>{await new Promise(r=>setTimeout(r,1600));await pullFinanceFromExcel(true)})}
function editFinance(id){editingFinanceId=id;financeTab='moves';financeDraftDate=null;finance();window.scrollTo({top:0,behavior:'smooth'})} function cancelFinanceEdit(){editingFinanceId=null;finance()}
async function deleteFinance(id){let x=data.finance.find(z=>z.id===id);if(!x||!confirm(`Eliminar ${x.subconcept||x.concept||'este movimiento'} por ${money(x.amount)}?`))return;lastDeletedFinance={...x};data.finance=data.finance.filter(z=>z.id!==id);data.sync.queue=data.sync.queue.filter(z=>z!==id);if(editingFinanceId===id)editingFinanceId=null;save(false);finance();if(sb&&cloudUser){try{let {error}=await sb.from('finance').delete().eq('id',id).eq('user_id',cloudUser.id);if(error)throw error}catch(e){console.warn('Delete finance',e);alert('Se eliminó localmente, pero Nate Cloud no confirmó el borrado. Revisa conexión y vuelve a sincronizar si es necesario.')}}}
function undoDeleteFinance(){if(!lastDeletedFinance)return;let x={...lastDeletedFinance,syncStatus:'pending'};if(!data.finance.some(z=>z.id===x.id))data.finance.push(x);if(!data.sync.queue.includes(x.id))data.sync.queue.push(x.id);lastDeletedFinance=null;save(false);syncFinance();finance()}
async function cloudInit(){
  if(!sb)return;
  try{let {data:{session}}=await sb.auth.getSession();cloudUser=session?.user||null;if(cloudUser){await syncFinance();await pullFinanceFromExcel(false)}}catch(e){console.warn('Cloud init',e)}
}
async function cloudLogin(){
  if(!sb)return alert('Supabase no cargó. Revisa tu conexión.');
  let email=val('cloud-email').trim(),password=val('cloud-pass');
  if(!email||!password)return alert('Escribe correo y contraseña.');
  let {data:r,error}=await sb.auth.signInWithPassword({email,password});
  if(error)return alert('No se pudo iniciar sesión: '+error.message);
  cloudUser=r.user; await sb.from('profiles').upsert({user_id:cloudUser.id,display_name:'Nate',timezone:TZ},{onConflict:'user_id'}); await syncFinance(); await pullFinanceFromExcel(false); settings();
}
async function cloudLogout(){if(sb)await sb.auth.signOut();cloudUser=null;settings()}
async function syncFinance(){
  if(!sb||!navigator.onLine)return;
  if(!cloudUser){try{let {data:{session}}=await sb.auth.getSession();cloudUser=session?.user||null}catch{};if(!cloudUser)return}
  for(const id of [...data.sync.queue]){
    let x=data.finance.find(z=>z.id===id);if(!x){data.sync.queue=data.sync.queue.filter(z=>z!==id);continue}
    let row={id:x.id,user_id:cloudUser.id,transaction_date:x.date||today(),transaction_type:(x.type||'Gasto').toLowerCase(),concept:x.concept||x.category||'Otros',subcategory:x.subconcept||null,amount:n(x.amount),payment_method:(x.payment==='Efectivo'?'Efectivo':x.payment==='Transferencia'?'Transferencia':x.payment==='Pluxee'?'Vales':'Tarjeta'),account_card:x.payment||x.method||null,installments:n(x.msi)||1,note:x.note||null,source:'NLT'};
    try{let {error}=await sb.from('finance').upsert(row,{onConflict:'id'});if(error)throw error;x.syncStatus='synced';data.sync.queue=data.sync.queue.filter(z=>z!==id);save(false)}catch(e){console.warn('Sync finance',e);x.syncStatus='error';save(false);break}
  }
}

function weekly(){let end=dateObj(today()),start=new Date(end);start.setDate(end.getDate()-6);let ds=d=>d.toLocaleDateString('en-CA'),dates=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);dates.push(ds(d))}let gymDone=dates.filter(d=>data.gymAttendance[d]==='completed'||data.gymAttendance[d]===true).length,football=dates.filter(d=>data.football[d]?.status==='played').length,cardioMin=dates.reduce((a,d)=>a+n(data.cardio[d]?.minutes),0),readMin=data.reading.sessions.filter(x=>dates.includes(x.date)).reduce((a,x)=>a+n(x.minutes),0),prayer=dates.filter(d=>data.faith[d]?.prayed).length;$('app').innerHTML=`${back()}${section('Weekly Reset','Revisar para corregir dirección, no para castigarte.')}<div class="grid2"><div class="card"><div class="eyebrow">GYM</div><div class="metric">${gymDone}</div><div class="small muted">sesiones</div></div><div class="card"><div class="eyebrow">FÚTBOL</div><div class="metric">${football}</div><div class="small muted">asistencias</div></div><div class="card"><div class="eyebrow">CARDIO</div><div class="metric">${cardioMin}</div><div class="small muted">minutos</div></div><div class="card"><div class="eyebrow">LECTURA</div><div class="metric">${readMin}</div><div class="small muted">minutos</div></div></div><div class="card stack" style="margin-top:11px"><div><span class="label">Oración</span><b>${prayer}/7 días registrados</b></div><label><span class="label">¿Qué funcionó?</span><textarea id="wr-good" class="field"></textarea></label><label><span class="label">¿Qué debo corregir?</span><textarea id="wr-fix" class="field"></textarea></label><label><span class="label">Lo verdaderamente importante esta semana</span><textarea id="wr-focus" class="field"></textarea></label><button class="btn" onclick="saveWeekly()">Cerrar semana</button></div>`} function saveWeekly(){data.weeklyReviews[today()]={good:val('wr-good'),fix:val('wr-fix'),focus:val('wr-focus')};save(false);weekly()}
function settings(){let status=cloudUser?`Conectado como ${esc(cloudUser.email||'Nate')}`:'Sin iniciar sesión';$('app').innerHTML=`${back()}${section('Configuración','Seguridad local y sincronización en la nube.')}<div class="card stack"><h2>Nate Cloud · Supabase</h2><div class="small muted">${status}. La contraseña se envía directamente a Supabase y NLT no la guarda en localStorage.</div>${cloudUser?`<div class="notice small"><span class="syncdot ok"></span> Nube activa · ${data.sync.queue.length} pendiente(s)</div><button class="btn" onclick="syncFinance().then(settings)">Sincronizar ahora</button><button class="btn light" onclick="cloudLogout()">Cerrar sesión de nube</button>`:`${field('Correo NLT','cloud-email','nategoramusic@gmail.com','email')}${field('Contraseña NLT','cloud-pass','','password')}<button class="btn" onclick="cloudLogin()">Conectar Nate Cloud</button>`}</div><div class="card stack" style="margin-top:11px"><h2>Excel</h2><div class="small muted">Los movimientos ya pueden vivir en Nate Cloud. El siguiente paso será conectar tu Excel para que lea esta fuente automáticamente.</div></div><div class="card stack" style="margin-top:11px"><h2>PIN</h2>${field('Nuevo PIN','newpin','','password')}<button class="btn light" onclick="changePin()">Cambiar PIN</button><button class="btn danger" onclick="lock()">Bloquear ahora</button></div>`}
function changePin(){let p=val('newpin');if(!/^\d{4,8}$/.test(p))return alert('PIN de 4 a 8 dígitos.');data.pin=p;save(false);alert('PIN actualizado.')} function lock(){sessionStorage.removeItem('nlt-unlocked');render()}

function backup(){$('app').innerHTML=`${back()}${section('Datos & Backup')}<div class="stack">${menu('Exportar Excel','Copia local de tus registros de NLT.',"exportExcel()")}${menu('Backup JSON','Respaldo completo de datos estructurados.',"exportJSON()")}${`<div class="card"><h3>Restaurar JSON</h3><input class="field" style="margin-top:10px" type="file" accept=".json" onchange="importJSON(event)"></div>`}</div>`}
function exportJSON(){dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`NLT_Backup_${today()}.json`)} function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(confirm('Reemplazar datos actuales?')){data={...fresh(),...x};save();alert('Restaurado')}}catch{alert('Backup inválido')}};r.readAsText(f)} function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportExcel(){if(typeof XLSX==='undefined')return alert('Módulo Excel no disponible.');let wb=XLSX.utils.book_new(),add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),name);add('Finanzas',data.finance);add('Cuerpo',Object.entries(data.body).map(([Fecha,x])=>({Fecha,...x})));add('Sueño',Object.entries(data.sleep).map(([Fecha,x])=>({Fecha,...x})));add('Fe',Object.entries(data.faith).map(([Fecha,x])=>({Fecha,...x})));add('Confesiones',data.confessions.map(Fecha=>({Fecha})));add('Cardio',Object.entries(data.cardio).map(([Fecha,x])=>({Fecha,...x})));add('Futbol',Object.entries(data.football).map(([Fecha,x])=>({Fecha,...x})));add('Lectura',data.reading.sessions);add('Eventos',data.events);let nr=[];Object.entries(data.mealLog).forEach(([Fecha,l])=>baseMeals.forEach(m=>{let x=l[m.id];if(x?.done){let z=mealMacros(x.items||m.items);nr.push({Fecha,Comida:m.name,Calorias:Math.round(z.k),Proteina:+z.p.toFixed(1),Carbs:+z.c.toFixed(1),Grasas:+z.f.toFixed(1),Nota:x.note||''})}}));add('Nutricion',nr);XLSX.writeFile(wb,`Nate_Life_Tracker_${today()}.xlsx`)}

window.addEventListener('online',syncFinance);if(sb)sb.auth.onAuthStateChange((_e,session)=>{cloudUser=session?.user||null});save(false);render();cloudInit();
